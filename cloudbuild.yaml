# Builds and deploys the Python runtime container to Google Cloud Run.

steps:
  # Step 1: Build the container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/society-tracker/society-management-app:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/society-tracker/society-management-app:latest'
      - '.'

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/society-tracker/society-management-app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/society-tracker/society-management-app:latest'

  # Step 3: Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'society-management-app'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/society-tracker/society-management-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'APP_ENV=production'
      - '--set-secrets'
      - 'GATE_PASS_SECRET=gate-pass-secret:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/society-tracker/society-management-app:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/society-tracker/society-management-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
