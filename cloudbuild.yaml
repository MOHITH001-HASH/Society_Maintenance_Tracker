# Google Cloud Build Pipeline Configuration
# Builds Docker container and deploys directly to Google Cloud Run

steps:
  # Step 1: Build the container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/society-management-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/society-management-app:latest'
      - '.'

  # Step 2: Push the container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/society-management-app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/society-management-app:latest'

  # Step 3: Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'society-management-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/society-management-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'

images:
  - 'gcr.io/$PROJECT_ID/society-management-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/society-management-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
